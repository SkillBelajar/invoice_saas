services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-https://invoice.pawandigital.id}
      APP_NAME: "Invoice SaaS"
      APP_VERSION: ${APP_VERSION:-0.8}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-invoice_saas}
      DB_USERNAME: ${DB_USERNAME:-invoice_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      OCTANE_SERVER: swoole
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoice

  web:
    image: nginx:alpine
    container_name: invoice_web
    restart: unless-stopped
    ports:
      - "8181:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - invoice

  db:
    image: mysql:8.0
    container_name: invoice_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-invoice_saas}
      MYSQL_USER: ${DB_USERNAME:-invoice_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33071:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - invoice

  redis:
    image: redis:alpine
    container_name: invoice_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "63801:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - invoice

volumes:
  db_data:
  redis_data:

networks:
  invoice:
    driver: bridge
