upstream octane {
    server app:8000;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map "$forwarded_proto:$http_host" $calculated_port {
    "~^https:.*:(\d+)$" $1;
    "~^http:.*:(\d+)$"  $1;
    "~^https:"          443;
    "~:(\d+)$"          $1;
    default             8181;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ''      $calculated_port;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # Octane serves public/ itself, so everything upstream
    location / {
        proxy_pass http://octane;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
    }

    # Built Vite assets: serve from disk, fall back to Octane
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri @octane;
    }

    location @octane {
        proxy_pass http://octane;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }
}
